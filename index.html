<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Leandro Montedonico · Director</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(145deg, #f2ede6 0%, #e8dfd3 100%);
      color: #1a1a1a;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(100,70,40,0.12);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px 32px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fdf0e2;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar svg {
      width: 36px;
      height: 36px;
      color: #a0622a;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .role {
      font-size: 0.9rem;
      color: #888;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      color: #a0622a;
      background: #fdf0e2;
      border-radius: 20px;
      padding: 4px 12px;
      line-height: 1.5;
    }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 24px 0;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #faf9f7;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .contact-item:hover,
    .contact-item:active {
      background: #fdf0e2;
    }

    .contact-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-item:nth-child(1) .contact-icon {
      background: #e8f4ef;
    }

    .contact-item:nth-child(1) .contact-icon svg {
      color: #5aab85;
    }

    .contact-item:nth-child(2) .contact-icon {
      background: #fef0e8;
    }

    .contact-item:nth-child(2) .contact-icon svg {
      color: #e08a5a;
    }

    .contact-icon svg {
      width: 18px;
      height: 18px;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .contact-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      font-weight: 500;
    }

    .contact-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .add-contact-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #2c1a0e;
      color: #fff;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.1px;
      transition: background 0.15s, transform 0.1s;
      cursor: pointer;
      border: none;
    }

    .add-contact-btn:hover {
      background: #3d2518;
    }

    .add-contact-btn:active {
      transform: scale(0.98);
    }

    .add-contact-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.72rem;
      color: #ccc;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <h1>Leandro Montedonico</h1>
      <p class="role">Director</p>
      <span class="badge">Torque and Taste</span>
    </div>

    <hr class="divider">

    <div class="contact-list">
      <a class="contact-item" href="tel:+541130084910">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 3.09 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </div>
        <div class="contact-info">
          <span class="contact-label">Teléfono</span>
          <span class="contact-value">+54 11 3008-4910</span>
        </div>
      </a>

      <a class="contact-item" href="mailto:leandro.montedonico@gmail.com">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
        <div class="contact-info">
          <span class="contact-label">E-mail</span>
          <span class="contact-value">leandro.montedonico@gmail.com</span>
        </div>
      </a>
    </div>

    <button class="add-contact-btn" onclick="saveContact()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      Agregar a Contactos
    </button>

    <p class="footer">Director · Torque and Taste</p>
  </div>

  <script>
    function saveContact() {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Leandro Montedonico',
        'N:Montedonico;Leandro;;;',
        'ORG:Torque and Taste',
        'TITLE:Director',
        'TEL;TYPE=CELL:+541130084910',
        'EMAIL;TYPE=INTERNET:leandro.montedonico@gmail.com',
        'END:VCARD'
      ].join('\r\n');

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      if (isIOS) {
        // iOS Safari: navigate to data URI so Contacts app intercepts it
        window.location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard);
      } else {
        // Android, desktop, etc: Blob download
        const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'leandro-montedonico.vcf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 150);
      }
    }
  </script>
</body>
</html>
