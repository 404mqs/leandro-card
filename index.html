<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0c0b" id="meta-theme-color">
  <title>Leandro Montedonico · Director</title>

  <!-- Detect theme before first paint to avoid flash -->
  <script>
    (function () {
      var s = localStorage.getItem('tat-theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = s || d;
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────── */
    :root[data-theme="dark"] {
      --bg:          #0d0c0b;
      --card:        #151210;
      --text:        #f0ece3;
      --muted:       #55504a;
      --accent:      #c9a96e;
      --accent-dim:  rgba(201,169,110,0.10);
      --line:        #272220;
      --item:        #1d1a17;
      --item-hover:  #252118;
      --item-border: transparent;
      --item-hover-border: #c9a96e;
      --cta-bg:      #c9a96e;
      --cta-text:    #0d0c0b;
      --toggle-bg:   #1d1a17;
      --toggle-border: #272220;
      --shadow:      0 12px 60px rgba(0,0,0,0.6);
      --meta:        #0d0c0b;
    }

    :root[data-theme="light"] {
      --bg:          #f4efe6;
      --card:        #ffffff;
      --text:        #1a1204;
      --muted:       #9a9080;
      --accent:      #8a6020;
      --accent-dim:  rgba(138,96,32,0.07);
      --line:        #ece6da;
      --item:        #faf7f1;
      --item-hover:  #f3ead8;
      --item-border: transparent;
      --item-hover-border: #8a6020;
      --cta-bg:      #1a1204;
      --cta-text:    #f4efe6;
      --toggle-bg:   #f4efe6;
      --toggle-border: #ddd6c8;
      --shadow:      0 8px 40px rgba(80,50,10,0.12);
      --meta:        #f4efe6;
    }

    /* ── Base ───────────────────────────────────────────── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      transition: background 0.35s, color 0.35s;
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: 2px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      padding: 48px 36px 36px;
      position: relative;
      transition: background 0.35s, box-shadow 0.35s;
    }

    /* ── Theme toggle ───────────────────────────────────── */
    .theme-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 34px;
      height: 34px;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      padding: 0;
    }

    .theme-toggle:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .theme-toggle svg { width: 15px; height: 15px; }
    .theme-toggle .icon-moon { display: none; }

    :root[data-theme="light"] .theme-toggle .icon-sun  { display: none; }
    :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .monogram {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 3px;
      transition: border-color 0.35s, color 0.35s;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .role {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 3.5px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 18px;
      transition: color 0.35s;
    }

    .company-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.35s;
    }

    .company-tag::before,
    .company-tag::after {
      content: '';
      display: block;
      width: 22px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    /* ── Divider ─────────────────────────────────────────── */
    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 28px 0;
      transition: border-color 0.35s;
    }

    /* ── Contact list ────────────────────────────────────── */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 2px;
      background: var(--item);
      border: 1px solid var(--item-border);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s;
    }

    .contact-item:hover,
    .contact-item:active {
      background: var(--item-hover);
      border-color: var(--item-hover-border);
    }

    .contact-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
      transition: color 0.35s;
    }

    .contact-icon svg { width: 17px; height: 17px; }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .contact-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      font-weight: 500;
      transition: color 0.35s;
    }

    .contact-value {
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.35s;
    }

    /* ── Add to contacts ─────────────────────────────────── */
    .add-contact-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      background: var(--cta-bg);
      color: var(--cta-text);
      border-radius: 2px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.68rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s, background 0.35s, color 0.35s;
    }

    .add-contact-btn:hover  { opacity: 0.85; }
    .add-contact-btn:active { transform: scale(0.99); }
    .add-contact-btn svg    { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.35s;
    }
  </style>
</head>
<body>
  <div class="card">

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2"  x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="4.22" y1="4.22"   x2="6.34" y2="6.34"/>
        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
        <line x1="2"  y1="12" x2="5"  y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="19.78"  x2="6.34" y2="17.66"/>
        <line x1="17.66" y1="6.34"  x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <div class="header">
      <div class="monogram">L·M</div>
      <h1>Leandro Montedonico</h1>
      <p class="role">Director</p>
      <span class="company-tag">Torque and Taste</span>
    </div>

    <hr class="divider">

    <div class="contact-list">
      <a class="contact-item" href="tel:+541130084910">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 3.09 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </div>
        <div class="contact-info">
          <span class="contact-label">Teléfono</span>
          <span class="contact-value">+54 11 3008-4910</span>
        </div>
      </a>

      <a class="contact-item" href="mailto:leandro.montedonico@gmail.com">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
        <div class="contact-info">
          <span class="contact-label">E-mail</span>
          <span class="contact-value">leandro.montedonico@gmail.com</span>
        </div>
      </a>
    </div>

    <button class="add-contact-btn" onclick="saveContact()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      Agregar a Contactos
    </button>

    <p class="footer">torqueandtaste.com</p>
  </div>

  <script>
    var html = document.documentElement;
    var metaTheme = document.getElementById('meta-theme-color');
    var META = { dark: '#0d0c0b', light: '#f4efe6' };

    function applyTheme(t) {
      html.dataset.theme = t;
      metaTheme.content = META[t];
      localStorage.setItem('tat-theme', t);
    }

    function toggleTheme() {
      applyTheme(html.dataset.theme === 'dark' ? 'light' : 'dark');
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!localStorage.getItem('tat-theme')) applyTheme(e.matches ? 'dark' : 'light');
    });

    function saveContact() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Leandro Montedonico',
        'N:Montedonico;Leandro;;;',
        'ORG:Torque and Taste',
        'TITLE:Director',
        'TEL;TYPE=CELL:+541130084910',
        'EMAIL;TYPE=INTERNET:leandro.montedonico@gmail.com',
        'END:VCARD'
      ].join('\r\n');

      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        window.location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard);
      } else {
        var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'leandro-montedonico.vcf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 150);
      }
    }
  </script>
</body>
</html>
